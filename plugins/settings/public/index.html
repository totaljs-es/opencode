<ui-component name="miniform" path="common.form" config="if:~PATH~;icon:ti ti-settings;title:@(Settings);reload:?/reload;scrollbar:1;width:620" class="hidden" plugin="~PATH~">
	<div class="padding">
		<div class="b mb10"><i class="ti ti-plug-connected mr5"></i>@(Providers)</div>
		<div class="help mb10">@(A provider is any server with an OpenAI-compatible API: OpenRouter, OpenAI, Ollama, LM Studio... Prompts go only to the providers you add here.)</div>
		<div class="mb10">
			<button class="exec" data-exec="?/detect"><i class="ti ti-radar"></i>@(Look for servers on this computer)</button>
		</div>
		<ui-bind path="?.found" config="template" class="block">
			<script type="text/html">
				{{ if value && !value.length }}<div class="mb10 gray">@(No Ollama, llama.cpp or LM Studio server answered on this computer.)</div>{{ fi }}
				{{ foreach f in value }}
				<div class="mb5" style="border:1px dashed #27AE60;border-radius:6px;padding:8px 10px;display:flex;gap:8px;align-items:center">
					<i class="ti ti-device-desktop green"></i>
					<div style="flex:1;min-width:0"><b>{{ f.template.name }}</b> <span class="gray fs12">{{ f.template.url }} &middot; {{ f.models.length }} @(models)</span></div>
					<button class="exec" data-exec="?/addfound" data-id="{{ f.template.id }}">@(Add)</button>
				</div>
				{{ end }}
			</script>
		</ui-bind>
		<ui-bind path="?.items" config="template" class="block">
			<script type="text/html">
				{{ if !value || !value.length }}<div class="mb10">@(No providers yet.)</div>{{ fi }}
				{{ foreach m in value }}
				<div class="exec mb5" data-exec="?/edit" data-id="{{ m.id }}" style="cursor:pointer;border:1px solid #E0E0E0;border-radius:6px;padding:8px 10px;display:flex;gap:8px;align-items:center">
					<i class="ti ti-server"></i>
					<div style="flex:1;min-width:0">
						<b>{{ m.name }}</b>{{ if m.disabled }} <span class="badge badge-small">@(disabled)</span>{{ fi }}
						<div class="gray fs12 hellip">{{ m.url }} &middot; {{ m.models.length }} @(models){{ if m.haskey }} &middot; <i class="ti ti-key"></i>{{ fi }}</div>
					</div>
					<span class="exec" data-exec="?/remove" data-prevent="true" data-id="{{ m.id }}" title="@(Remove)"><i class="ti ti-trash red"></i></span>
				</div>
				{{ end }}
			</script>
		</ui-bind>
		<div class="mt10">
			<button class="exec" data-exec="?/create"><i class="ti ti-plus-circle"></i>@(Add a provider)</button>
		</div>
	</div>
	<nav>
		<button name="cancel">@(Close)</button>
	</nav>
</ui-component>

<script>

	PLUGIN(function(exports) {

		var templates = {};

		exports.reload = function() {
			exports.refresh();
		};

		exports.refresh = function() {
			exports.tapi('providers', function(response) {
				exports.set('items', response);
			});
		};

		// Templates of known providers: the choice prefills the form
		exports.create = function(el) {
			exports.tapi('providers_templates', function(templates) {
				var opt = {};
				opt.element = el;
				opt.align = 'left';
				opt.items = templates.map(function(t) {
					return { id: t.id, name: t.name + (t.local ? ' (@(this computer))' : ''), icon: t.local ? 'ti ti-device-desktop' : 'ti ti-cloud' };
				});
				opt.items.push('-');
				opt.items.push({ id: '', name: '@(Other, OpenAI-compatible)', icon: 'ti ti-plug' });
				opt.callback = function(item) {
					var t = templates.findItem('id', item.id) || { name: '', url: '', kind: 'openai', help: '' };
					SET('formprovider @default', { name: t.name, url: t.url, kind: t.kind, key: '', models: [], help: t.help, keyrequired: t.keyrequired });
					SET('common.form2', 'formprovider');
				};
				SETTER('menu/show', opt);
			});
		};

		exports.detect = function() {
			exports.tapi('providers_detect', function(found) {
				exports.set('found', found);
				templates = {};
				found.forEach(f => templates[f.template.id] = f);
			});
		};

		// Adds a detected server with all its models and what each one can do
		exports.addfound = function(el) {
			var f = templates[ATTRD(el)];
			if (!f)
				return;
			var meta = {};
			f.models.forEach(m => meta[m.id] = m);
			exports.tapi('providers_save ERROR', { name: f.template.name, url: f.template.url, kind: f.template.kind, models: f.models.map(m => m.id), meta: meta }, function() {
				SETTER('notify/success', '@(Added:) ' + f.template.name);
				exports.refresh();
				PLUGINS.chat && PLUGINS.chat.models();
			});
		};

		exports.edit = function(el) {
			var id = ATTRD(el);
			var item = (exports.model.items || []).findItem('id', id);
			if (item) {
				var data = CLONE(item);
				data.key = '';
				data.kind = data.kind || 'openai';
				SET('formprovider @reset', data);
				SET('common.form2', 'formprovider');
			}
		};

		exports.remove = function(el) {
			var id = ATTRD(el);
			SETTER('approve/show', '@(Remove this provider?)', ':ti ti-trash: @(Remove)', function() {
				exports.tapi('providers_remove/' + id + ' ERROR', function() {
					exports.refresh();
					PLUGINS.chat && PLUGINS.chat.models();
				});
			});
		};

	});

</script>
